project_id = "deutschconnect"

[auth]
enabled = true
minimum_password_length = 12
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173", "http://localhost:5173", "http://localhost:4173", "http://127.0.0.1:4173"]

[auth.email]
enabled = true
enable_confirmations = true
double_confirm_changes = true

[functions.platform]
verify_jwt = false # Function verifies each token with Auth /user, including new signing keys.
